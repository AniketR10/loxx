name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the same checks first

permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        # Every system and architecture loxx ships for, each on native
        # hardware: Linux amd64/arm64, macOS on Apple chips and on Intel.
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # `make model` (run by lint/test/build) downloads the weights from the
      # public model release and verifies their SHA-256; the cache avoids
      # downloading them on every run.
      - name: Cache model weights
        uses: actions/cache@v6
        with:
          path: internal/embed/model/minilm-l6-v2.f16.safetensors
          key: model-${{ hashFiles('Makefile') }}
      - name: Install zsh (for the shell hook tests; macOS already has it)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build and verify it is one self-contained file
        run: make check-static
      - name: Smoke test
        run: ./bin/loxx version
      # The Linux version of this check runs in a fresh Fedora container
      # (tools/installtest/run.sh); a macOS runner is already a fresh Mac.
      - name: Install check (macOS, as a fresh zsh user)
        if: runner.os == 'macOS'
        run: |
          make dist DIST_TARGETS="darwin/$(go env GOARCH)"
          LOXX_RELEASE_URL="file://$PWD/dist" sh tools/installtest/macos.sh

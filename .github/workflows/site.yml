name: Website

# Publishes site/ to https://loxx.run (GitHub Pages), with the latest release's
# install.sh served at /install, so `curl -fsSL https://loxx.run/install | sh`
# always matches the binaries it downloads. Runs when the site changes and when
# a full release (not a pre-release) is published. Until the first full
# release exists, it checks the site and skips publishing.
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/sitecheck.py', 'tools/gametest.js', '.github/workflows/site.yml']
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write    # publish to GitHub Pages
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the site
        run: |
          python3 tools/sitecheck.py
          node tools/gametest.js
      - name: Copy the latest release's installer to /install
        id: installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern install.sh --output site/install; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::No full release yet (pre-releases don't count), so the site is not published. It goes live with v0.1.0."
          fi
      - if: steps.installer.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - if: steps.installer.outputs.ready == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
